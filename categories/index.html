<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>七夕 · 与你</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text-main: #f8f3ef;
            --text-soft: rgba(248, 243, 239, 0.72);
            --accent: #f0c5bb;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.14);
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family:
                "PingFang SC",
                "Microsoft YaHei",
                "Noto Sans SC",
                sans-serif;
            color: var(--text-main);

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(145, 118, 154, 0.28),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(107, 79, 112, 0.25),
                    transparent 35%
                ),
                linear-gradient(
                    145deg,
                    #11101a 0%,
                    #201724 45%,
                    #171321 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 星光背景 */
        .stars {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            animation: twinkle ease-in-out infinite;
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* 月亮 */
        .moon {
            position: fixed;
            top: 8%;
            right: 9%;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 35% 35%,
                    #fffaf2,
                    #edd8c7 55%,
                    #c7aeb1 100%
                );
            box-shadow:
                0 0 45px rgba(255, 225, 208, 0.24),
                0 0 110px rgba(255, 213, 196, 0.1);

            opacity: 0.85;
        }

        .moon::after {
            content: "";
            position: absolute;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            top: -8px;
            left: -14px;
            background: #181320;
        }

        /* 主卡片 */
        .container {
            width: min(92vw, 880px);
            min-height: 520px;

            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            align-items: center;
            gap: 56px;

            padding: 56px;

            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 32px;

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 32px 80px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            position: relative;
            z-index: 10;

            animation: fadeUp 1.2s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 照片区域 */
        .photo-wrap {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .photo-wrap::before {
            content: "";
            position: absolute;
            width: 280px;
            height: 350px;
            border-radius: 150px 150px 36px 36px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transform: translate(14px, 14px);
        }

        .photo {
            width: 280px;
            height: 350px;
            object-fit: cover;
            border-radius: 150px 150px 36px 36px;

            border: 1px solid rgba(255, 255, 255, 0.2);

            box-shadow:
                0 22px 55px rgba(0, 0, 0, 0.28),
                0 0 60px rgba(232, 197, 187, 0.08);
        }

        /* 文案区域 */
        .content {
            text-align: left;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 18px;

            color: var(--accent);
            font-size: 13px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 28px;
            height: 1px;
            background: var(--accent);
            opacity: 0.8;
        }

        h1 {
            font-family:
                "Songti SC",
                "STSong",
                "SimSun",
                serif;

            font-size: clamp(42px, 6vw, 68px);
            font-weight: 400;

            letter-spacing: 0.08em;
            line-height: 1.16;

            margin-bottom: 26px;
        }

        h1 span {
            color: var(--accent);
        }

        .quote {
            max-width: 430px;

            font-family:
                "Songti SC",
                "STSong",
                serif;

            font-size: 18px;
            line-height: 2;
            letter-spacing: 0.06em;

            color: rgba(255, 255, 255, 0.84);
        }

        .quote strong {
            color: #fff;
            font-weight: 500;
        }

        .divider {
            width: 56px;
            height: 1px;

            margin: 30px 0 24px;

            background:
                linear-gradient(
                    to right,
                    var(--accent),
                    transparent
                );
        }

        .signature {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-soft);
        }

        .signature .love {
            display: block;

            margin-top: 8px;

            color: var(--accent);
            font-family:
                "Songti SC",
                "STSong",
                serif;

            font-size: 17px;
            letter-spacing: 0.08em;
        }

        /* 底部小装饰 */
        .footer-text {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);

            font-size: 11px;
            letter-spacing: 0.28em;

            color: rgba(255, 255, 255, 0.3);
            z-index: 3;
            white-space: nowrap;
        }

        /* 流星 */
        .meteor {
            position: fixed;
            width: 140px;
            height: 1px;

            background:
                linear-gradient(
                    to right,
                    rgba(255, 255, 255, 0),
                    rgba(255, 255, 255, 0.7)
                );

            transform: rotate(-35deg);
            opacity: 0;

            animation: meteor 8s linear infinite;
        }

        @keyframes meteor {
            0%,
            70% {
                opacity: 0;
                transform: translate(0, 0) rotate(-35deg);
            }

            72% {
                opacity: 0.8;
            }

            82% {
                opacity: 0;
                transform: translate(-350px, 250px) rotate(-35deg);
            }

            100% {
                opacity: 0;
            }
        }

        .meteor.one {
            top: 15%;
            right: 12%;
            animation-delay: 1s;
        }

        .meteor.two {
            top: 36%;
            right: 3%;
            animation-delay: 5s;
            animation-duration: 11s;
        }

        /* 手机适配 */
        @media (max-width: 720px) {
            body {
                overflow-y: auto;
                padding: 36px 18px;
            }

            .moon {
                width: 80px;
                height: 80px;
                top: 4%;
                right: 6%;
            }

            .moon::after {
                width: 62px;
                height: 62px;
            }

            .container {
                grid-template-columns: 1fr;
                gap: 34px;

                padding: 28px 24px 34px;
                border-radius: 26px;
            }

            .photo {
                width: min(72vw, 280px);
                height: min(88vw, 350px);
            }

            .photo-wrap::before {
                width: min(72vw, 280px);
                height: min(88vw, 350px);
            }

            .content {
                text-align: center;
            }

            .eyebrow {
                justify-content: center;
            }

            h1 {
                font-size: 46px;
            }

            .quote {
                font-size: 16px;
                line-height: 1.9;
            }

            .divider {
                margin-left: auto;
                margin-right: auto;
            }

            .footer-text {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="stars" id="stars"></div>

    <div class="moon"></div>

    <div class="meteor one"></div>
    <div class="meteor two"></div>

    <main class="container">

        <div class="photo-wrap">
            <!-- 换成你们自己的照片 -->
            <img
                src="your_photo.jpg"
                alt="我们的照片"
                class="photo"
            />
        </div>

        <section class="content">

            <div class="eyebrow">
                QIXI · FOR YOU
            </div>

            <h1>
                今夕，<br />
                仍想与你<span>相见</span>
            </h1>

            <div class="quote">
                人们把今晚叫作七夕，<br />
                把银河两岸的相逢写成浪漫。<br /><br />

                可对我来说，<br />
                <strong>真正值得庆幸的，</strong><br />
                是茫茫人海里，我恰好遇见了你。
            </div>

            <div class="divider"></div>

            <div class="signature">
                往后的四季与朝夕，<br />
                也想继续和你一起慢慢走。

                <span class="love">
                    七夕快乐，我的爱人。
                </span>
            </div>

        </section>

    </main>

    <div class="footer-text">
        MEETING YOU WAS MY FAVORITE ACCIDENT
    </div>

    <script>
        const starsContainer = document.getElementById("stars");

        for (let i = 0; i < 90; i++) {
            const star = document.createElement("span");

            star.className = "star";

            const size = Math.random() * 2 + 1;

            star.style.width = size + "px";
            star.style.height = size + "px";

            star.style.left = Math.random() * 100 + "%";
            star.style.top = Math.random() * 100 + "%";

            star.style.animationDuration =
                Math.random() * 3 + 2 + "s";

            star.style.animationDelay =
                Math.random() * 4 + "s";

            starsContainer.appendChild(star);
        }
    </script>

</body>
</html>
